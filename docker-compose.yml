services:
  postgres:
    image: postgres:16-alpine
    container_name: aiia-ctms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aiia_ctms
    ports:
      - "5438:5432"
    volumes:
      - aiia_ctms_postgres_data:/var/lib/postgresql/data

volumes:
  aiia_ctms_postgres_data:
